<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>殷嘉祺 · 个人简历</title>
<meta name="description" content="殷嘉祺 — 临沂大学大一在读，AI 工具驱动的高效学习者与志愿服务实践者。">
<style>
/* ============ 设计变量 ============ */
:root{
  --bg:#f5f7fb; --bg-2:#ffffff;
  --card:#ffffff; --card-2:#fbfcfe;
  --text:#111827; --text-2:#4b5563; --muted:#6b7280;
  --line:#e5e8f0;
  --primary:#4f46e5; --primary-2:#7c3aed; --accent:#06b6d4;
  --ring:rgba(79,70,229,.35);
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px -12px rgba(16,24,40,.18);
  --shadow-h:0 2px 6px rgba(16,24,40,.06), 0 20px 44px -20px rgba(79,70,229,.5);
  --radius:16px; --nav-h:64px;
}
html[data-theme="dark"]{
  --bg:#0a0d14; --bg-2:#0f1320;
  --card:#121726; --card-2:#161c2c;
  --text:#e8ecf5; --text-2:#b9c2d4; --muted:#8b95a9;
  --line:#232b3d;
  --primary:#6366f1; --primary-2:#8b5cf6; --accent:#22d3ee;
  --ring:rgba(99,102,241,.45);
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 28px -14px rgba(0,0,0,.7);
  --shadow-h:0 2px 8px rgba(0,0,0,.5), 0 24px 48px -22px rgba(99,102,241,.55);
}

/* ============ 基础 ============ */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h) + 18px);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  font-size:15px;line-height:1.7;
  transition:background .25s ease,color .25s ease;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(58vw 58vw at 88% -12%, color-mix(in srgb,var(--primary) 22%,transparent), transparent 62%),
    radial-gradient(52vw 52vw at -12% 6%, color-mix(in srgb,var(--accent) 16%,transparent), transparent 62%),
    radial-gradient(46vw 46vw at 50% 108%, color-mix(in srgb,var(--primary-2) 14%,transparent), transparent 62%);
  transition:opacity .25s ease;
}
h1,h2,h3,h4{margin:0;line-height:1.3;letter-spacing:-.01em}
p{margin:0}
a{color:var(--primary);text-decoration:none}
ul{margin:0}
.container{width:min(1120px,100% - 40px);margin-inline:auto}
main{padding-top:calc(var(--nav-h) + 18px)}
@media (max-width:600px){ .container{width:calc(100% - 28px)} }

/* ============ 导航 ============ */
.nav{
  position:fixed;top:0;left:0;right:0;height:var(--nav-h);z-index:60;
  background:color-mix(in srgb,var(--bg) 80%,transparent);
  backdrop-filter:blur(16px) saturate(170%);
  -webkit-backdrop-filter:blur(16px) saturate(170%);
  border-bottom:1px solid var(--line);
}
.nav-in{display:flex;align-items:center;gap:14px;height:100%}
.brand{
  display:flex;align-items:center;gap:9px;font-weight:800;color:var(--text);
  font-size:15.5px;white-space:nowrap;letter-spacing:-.01em;flex:0 0 auto;
}
.brand .dot{
  width:9px;height:9px;border-radius:50%;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 16%,transparent);
}
.nav-links{
  display:flex;gap:2px;flex:1;justify-content:center;
  overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;
}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{
  color:var(--text-2);font-size:13.5px;font-weight:600;padding:7px 12px;border-radius:9px;
  white-space:nowrap;transition:background .18s ease,color .18s ease;
}
.nav-links a:hover{background:color-mix(in srgb,var(--primary) 9%,transparent);color:var(--text)}
.nav-links a.active{color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary-2))}
.nav-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.icon-btn{
  width:38px;height:38px;display:grid;place-items:center;border-radius:10px;
  border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}
.icon-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-h);border-color:transparent}
.icon-btn svg{width:17px;height:17px;fill:currentColor}
@media (max-width:760px){ .nav-links{display:none} .brand{flex:1} }

/* ============ 按钮 ============ */
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:12px;
  border:1px solid var(--line);background:var(--card);color:var(--text);
  font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease,background .18s ease;
}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-h);border-color:transparent}
.btn:active{transform:translateY(0)}
.btn.primary{
  background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;
  border-color:transparent;box-shadow:0 10px 24px -12px var(--ring);
}
.btn.sm{padding:8px 14px;font-size:13px;border-radius:10px}
.btn svg{width:15px;height:15px;fill:currentColor;flex:0 0 auto}

/* ============ Hero ============ */
.hero{
  display:grid;grid-template-columns:1.45fr .85fr;gap:34px;align-items:start;
  padding:22px 0 8px;
}
@media (max-width:920px){ .hero{grid-template-columns:1fr;gap:24px} }
.role{
  color:var(--primary);font-weight:800;font-size:12.5px;letter-spacing:.14em;
  text-transform:uppercase;margin-bottom:10px;
}
.hero h1{
  font-size:clamp(32px,5.2vw,50px);font-weight:900;letter-spacing:-.03em;
  margin-bottom:10px;
  background:linear-gradient(120deg,var(--text) 30%,var(--primary-2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.tagline{font-size:16px;font-weight:700;color:var(--text-2);margin-bottom:12px}
.summary{color:var(--text-2);font-size:14.6px;line-height:1.85;max-width:62ch}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 22px}
.badge{
  padding:5px 13px;border-radius:999px;font-size:12.5px;font-weight:600;
  background:var(--card);border:1px solid var(--line);color:var(--text-2);
  box-shadow:var(--shadow);transition:transform .18s ease,border-color .18s ease,color .18s ease;
}
.badge:hover{
  transform:translateY(-2px);color:var(--primary);
  border-color:color-mix(in srgb,var(--primary) 45%,var(--line));
}
.btns{display:flex;flex-wrap:wrap;gap:10px}

/* 快捷联系卡 */
.quick{padding:20px 22px}
.quick h3{
  font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  margin-bottom:14px;font-weight:800;
}
.qrow{
  display:flex;align-items:baseline;gap:12px;padding:9px 0;
  border-bottom:1px dashed var(--line);
}
.qrow:last-child{border-bottom:0;padding-bottom:0}
.qk{font-size:12px;font-weight:800;color:var(--muted);flex:0 0 42px;letter-spacing:.04em}
.qv{font-size:13.6px;font-weight:600;color:var(--text);word-break:break-all}
a.qv{color:var(--primary);cursor:pointer}
a.qv:hover{text-decoration:underline}

/* ============ 通用卡片/区块 ============ */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.section{padding:52px 0 8px}
.sec-head{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.sec-head h2{font-size:22px;font-weight:900;letter-spacing:-.02em;white-space:nowrap}
.sec-head .line{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.sec-head .idx{
  font-size:12px;font-weight:800;color:var(--primary);letter-spacing:.1em;
  background:color-mix(in srgb,var(--primary) 10%,transparent);
  border:1px solid color-mix(in srgb,var(--primary) 22%,transparent);
  padding:2px 9px;border-radius:999px;
}

/* ============ 亮点 ============ */
.hl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:14px}
.hl{
  position:relative;padding:20px 18px 18px;border-radius:14px;overflow:hidden;
  background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}
.hl::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--primary),var(--accent));
}
.hl:hover{transform:translateY(-4px);box-shadow:var(--shadow-h);border-color:transparent}
.hl .v{
  font-size:25px;font-weight:900;letter-spacing:-.02em;color:var(--primary);
  margin-bottom:4px;line-height:1.25;
}
.hl .k{font-size:13px;font-weight:800;color:var(--text);margin-bottom:8px}
.hl .d{font-size:12.4px;color:var(--muted);line-height:1.65}

/* ============ Tabs ============ */
.tabs{width:100%}
.tabbar{
  display:inline-flex;gap:4px;padding:4px;margin-bottom:20px;flex-wrap:wrap;
  border-radius:12px;background:var(--card);border:1px solid var(--line);
  box-shadow:var(--shadow);
}
.tab{
  appearance:none;border:0;background:transparent;color:var(--text-2);
  font-family:inherit;font-size:13.5px;font-weight:700;padding:8px 16px;
  border-radius:9px;cursor:pointer;transition:background .18s ease,color .18s ease,box-shadow .18s ease;
}
.tab:not([aria-selected="true"]):hover{
  background:color-mix(in srgb,var(--primary) 9%,transparent);color:var(--text);
}
.tab[aria-selected="true"]{
  color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary-2));
  box-shadow:0 8px 18px -10px var(--ring);
}
.tab:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.panel{display:none}
.panel.active{display:block;animation:fadeUp .3s cubic-bezier(.22,1,.36,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ============ 时间线 ============ */
.tl{position:relative;padding-left:22px}
.tl::before{
  content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;border-radius:2px;
  background:linear-gradient(180deg,var(--primary),color-mix(in srgb,var(--primary) 10%,transparent));
}
.tl-item{
  position:relative;margin-bottom:16px;padding:18px 20px;border-radius:14px;
  background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}
.tl-item:last-child{margin-bottom:0}
.tl-item:hover{transform:translateY(-3px);box-shadow:var(--shadow-h);border-color:transparent}
.tl-item::before{
  content:"";position:absolute;left:-20px;top:24px;width:10px;height:10px;border-radius:50%;
  background:var(--primary);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 18%,transparent);
}
.tl-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;justify-content:space-between}
.tl-top h3{font-size:15.5px;font-weight:800}
.period{
  font-size:12px;font-weight:700;color:var(--primary);
  background:color-mix(in srgb,var(--primary) 10%,transparent);
  border:1px solid color-mix(in srgb,var(--primary) 20%,transparent);
  padding:2px 10px;border-radius:999px;white-space:nowrap;
}
.tl-sub{font-size:13px;font-weight:700;color:var(--muted);margin:6px 0 10px}

/* ============ 要点列表 ============ */
.pts{padding-left:18px;color:var(--text-2);font-size:13.8px;line-height:1.8}
.pts li{margin-bottom:6px}
.pts li:last-child{margin-bottom:0}
.pts li::marker{color:var(--primary)}

/* ============ 项目 ============ */
.proj-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.proj{
  display:flex;flex-direction:column;gap:11px;padding:20px 22px;border-radius:16px;
  background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
}
.proj:hover{
  transform:translateY(-4px);box-shadow:var(--shadow-h);
  border-color:color-mix(in srgb,var(--primary) 38%,var(--line));
}
.proj-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;justify-content:space-between}
.proj-head h3{font-size:15.5px;font-weight:800}
.proj-role{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;
  background:color-mix(in srgb,var(--primary) 10%,transparent);color:var(--primary);
  border:1px solid color-mix(in srgb,var(--primary) 22%,transparent);
}
.proj-result{
  margin-top:auto;padding:10px 12px;border-radius:10px;font-size:12.6px;font-weight:700;
  color:var(--text-2);
  background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 9%,transparent),color-mix(in srgb,var(--accent) 9%,transparent));
  border:1px dashed color-mix(in srgb,var(--primary) 25%,var(--line));
}

/* ============ 技能 ============ */
.skill-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:16px}
.sg{
  padding:20px 22px;border-radius:14px;background:var(--card);
  border:1px solid var(--line);box-shadow:var(--shadow);
  transition:transform .2s ease,box-shadow .2s ease;
}
.sg:hover{transform:translateY(-3px);box-shadow:var(--shadow-h)}
.sg h3{
  display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:800;
  margin-bottom:16px;color:var(--text);
}
.sg h3::before{
  content:"";width:6px;height:6px;border-radius:2px;
  background:linear-gradient(135deg,var(--primary),var(--accent));
}
.sk{margin-bottom:13px}
.sk:last-child{margin-bottom:0}
.sk-top{display:flex;justify-content:space-between;gap:10px;font-size:12.8px;color:var(--text-2);font-weight:600;margin-bottom:6px}
.sk-top b{color:var(--primary);font-weight:800;font-size:12px}
.bar{
  height:6px;border-radius:99px;overflow:hidden;
  background:color-mix(in srgb,var(--text) 9%,transparent);
}
.bar i{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--primary),var(--accent));
  transition:width .9s cubic-bezier(.22,1,.36,1);
}

/* ============ 教育 & 证书 ============ */
.edu-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}
@media (max-width:860px){ .edu-grid{grid-template-columns:1fr} }
.edu{padding:22px 24px}
.edu-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 14px}
.edu-top h3{font-size:17px;font-weight:900}
.edu-top .period{font-size:11.5px}
.edu-sub{font-size:13px;font-weight:700;color:var(--muted);margin:6px 0 12px}
.cert{
  display:flex;align-items:flex-start;gap:12px;padding:13px 16px;margin-bottom:10px;
  border-radius:12px;background:var(--card);border:1px solid var(--line);
  box-shadow:var(--shadow);transition:transform .2s ease,box-shadow .2s ease;
}
.cert:last-child{margin-bottom:0}
.cert:hover{transform:translateY(-2px);box-shadow:var(--shadow-h)}
.cert .ico{
  flex:0 0 30px;height:30px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 16%,transparent),color-mix(in srgb,var(--accent) 16%,transparent));
  color:var(--primary);font-weight:900;font-size:13px;
}
.cert .nm{font-size:13.6px;font-weight:800;color:var(--text);line-height:1.5}
.cert .mt{font-size:12px;color:var(--muted);margin-top:2px}

/* ============ 占位标记 ============ */
.ph{
  display:inline-block;padding:0 6px;border-radius:5px;line-height:1.55;
  font-size:.88em;font-weight:700;vertical-align:baseline;
  background:color-mix(in srgb,var(--primary) 12%,transparent);
  color:var(--primary);
  border:1px dashed color-mix(in srgb,var(--primary) 42%,transparent);
}

/* ============ 页脚 / 回到顶部 / Toast ============ */
footer{border-top:1px solid var(--line);margin-top:56px;padding:26px 0 44px}
.foot-in{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.foot-in b{color:var(--text-2)}
.to-top{
  position:fixed;right:20px;bottom:22px;width:44px;height:44px;border-radius:12px;z-index:50;
  display:grid;place-items:center;cursor:pointer;color:var(--text);
  border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);
  opacity:0;visibility:hidden;transform:translateY(12px);
  transition:opacity .22s ease,transform .22s ease,visibility .22s ease,box-shadow .22s ease;
}
.to-top.show{opacity:1;visibility:visible;transform:none}
.to-top:hover{box-shadow:var(--shadow-h)}
.to-top svg{width:17px;height:17px;fill:currentColor}
.toast{
  position:fixed;left:50%;bottom:34px;z-index:99;
  transform:translate(-50%,14px);opacity:0;pointer-events:none;
  padding:10px 20px;border-radius:10px;font-size:13.5px;font-weight:700;
  background:var(--text);color:var(--bg);box-shadow:var(--shadow-h);
  transition:opacity .22s ease,transform .22s ease;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ============ 进入动画 ============ */
.reveal{opacity:0;transform:translateY(16px);transition:opacity .55s ease,transform .55s cubic-bezier(.22,1,.36,1)}
.reveal.in{opacity:1;transform:none}

/* ============ 减弱动效 ============ */
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;
  }
  .reveal{opacity:1!important;transform:none!important}
}

/* ============ 打印 ============ */
@page{margin:14mm 12mm}
@media print{
  html,html[data-theme="dark"]{
    --bg:#fff;--bg-2:#fff;--card:#fff;--card-2:#fff;
    --text:#111;--text-2:#333;--muted:#555;--line:#d8dde6;
    --primary:#3b3596;--primary-2:#5b3b8f;--accent:#0e7490;
    --shadow:none;--shadow-h:none;
  }
  body{background:#fff;font-size:11.6px;line-height:1.6}
  body::before{display:none!important}
  .nav,.to-top,.tabbar,.toast{display:none!important}
  main{padding-top:0!important}
  .container{width:100%;max-width:none}
  .hero{grid-template-columns:1fr;gap:10px;padding:0 0 6px}
  .section{padding:14px 0 0}
  .sec-head{margin-bottom:10px}
  .sec-head h2{font-size:15px}
  .hl-grid{grid-template-columns:repeat(5,1fr);gap:8px}
  .hl{padding:10px}
  .hl .v{font-size:14px}
  .hl .k{font-size:10.5px}
  .hl .d{font-size:9.5px}
  .card,.tl-item,.proj,.sg,.cert,.hl{box-shadow:none!important;break-inside:avoid}
  .panel{display:block!important;animation:none!important}
  .panel+.panel{margin-top:10px}
  .proj-grid,.skill-groups{grid-template-columns:1fr 1fr;gap:8px}
  .tl::before{display:none}
  .tl{padding-left:0}
  .tl-item::before{display:none}
  .badge,.chip,.ph{background:#f2f3f7!important;border:1px solid #d8dde6!important;color:#333!important}
  .btn{display:none!important}
  a{color:#111;text-decoration:none}
  .reveal{opacity:1!important;transform:none!important}
}
</style>

<main>

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
/* 把【待补】渲染成可见占位胶囊 */
function fmt(s) {
  return esc(s).replace(/【待补】/g, '<span class="ph">待补</span>');
}
function el(tag, cls, html) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
}
function hasText(v) { return v != null && String(v).trim() !== ""; }

function setTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  themeBtn.innerHTML = t === "dark" ? SUN_ICON : MOON_ICON;
  themeBtn.setAttribute("aria-label", t === "dark" ? "切换到浅色模式" : "切换到深色模式");
  try { localStorage.setItem("yjq-theme", t); } catch (e) {}
}
(function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem("yjq-theme"); } catch (e) {}
  const sysDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  setTheme(saved || (sysDark ? "dark" : "light"));
})();
themeBtn.addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  setTheme(cur === "dark" ? "light" : "dark");
});

/* =========================================================
   4. Toast / 复制
   ========================================================= */
let toastEl = null, toastTimer = null;
function toast(msg) {
  if (!toastEl) {
    toastEl = el("div", "toast");
    document.body.appendChild(toastEl);
  }
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1800);
}

async function copyText(text, msg) {
  let ok = false;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      ok = true;
    }
  } catch (e) { ok = false; }
  if (!ok) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:-1000px;left:-1000px;opacity:0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); ok = true; } catch (e) {}
    document.body.removeChild(ta);
  }
  toast(ok ? (msg || "已复制") : "复制失败，请手动选择");
}

    } else if (r.copy) {
      node = document.createElement("a");
      node.className = "qv";
      node.href = "javascript:void(0)";
      node.title = "点击复制";
      node.addEventListener("click", () => copyText(r.v, r.k + "已复制"));
    } else {
      node = el("span", "qv");
    }
    node.innerHTML = fmt(r.v);
    row.appendChild(node);
    q.appendChild(row);
  });
}

/* =========================================================
   7. Tabs 组件
   ========================================================= */
let tabUid = 0;
function buildTabs(groups, renderPanel) {
  const wrap = el("div", "tabs");
  const list = (groups || []).filter(g => g.items && g.items.length);
  if (!list.length) return wrap;

  const bar = el("div", "tabbar");
  bar.setAttribute("role", "tablist");
  bar.setAttribute("aria-label", "内容切换");
  const panelBox = el("div", "panels");
  const base = "tabs" + (++tabUid);
  const btns = [], pans = [];

  list.forEach((g, i) => {
    const b = el("button", "tab");
    b.type = "button";
    b.id = base + "-tab-" + i;
    b.setAttribute("role", "tab");
    b.setAttribute("aria-controls", base + "-panel-" + i);
    b.setAttribute("aria-selected", i === 0 ? "true" : "false");
    b.tabIndex = i === 0 ? 0 : -1;
    b.textContent = g.label;
    b.addEventListener("click", () => activate(i));
    b.addEventListener("keydown", e => {
      let n = -1;
      if (e.key === "ArrowRight") n = (i + 1) % list.length;
      else if (e.key === "ArrowLeft") n = (i - 1 + list.length) % list.length;
      else if (e.key === "Home") n = 0;
      else if (e.key === "End") n = list.length - 1;
      if (n > -1) { e.preventDefault(); activate(n); btns[n].focus(); }
    });
    bar.appendChild(b);
    btns.push(b);

    const p = el("div", "panel");
    p.id = base + "-panel-" + i;
    p.setAttribute("role", "tabpanel");
    p.setAttribute("aria-labelledby", b.id);
    p.tabIndex = 0;
    p.appendChild(renderPanel(g));
    panelBox.appendChild(p);
    pans.push(p);
  });

  function activate(i) {
    btns.forEach((b, j) => {
      b.setAttribute("aria-selected", j === i ? "true" : "false");
      b.tabIndex = j === i ? 0 : -1;
    });
    pans.forEach((p, j) => p.classList.toggle("active", j === i));
  }
  activate(0);

  wrap.appendChild(bar);
  wrap.appendChild(panelBox);
  return wrap;
}

/* =========================================================
   13. 启动
   ========================================================= */
(function boot() {
  renderNav();
  renderHero();
  renderHighlights();

  $("#expTabs").appendChild(buildTabs(resume.experience, renderExpPanel));
  $("#projTabs").appendChild(buildTabs(resume.projects, renderProjPanel));

  renderSkills();
  renderEducation();
  renderCerts();

  $("#year").textContent = new Date().getFullYear();
  $("#printBtn").addEventListener("click", () => window.print());

  /* 打印前展开全部面板，避免隐藏内容丢失（由 CSS 的 print 规则处理） */

  /* 进入动画 */
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const revealIO = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) {
        en.target.classList.add("in");
        revealIO.unobserve(en.target);
      }
    });
  }, { threshold: 0.12 });

  document.querySelectorAll(".reveal").forEach(n => {
    if (reduce) n.classList.add("in");
    else revealIO.observe(n);
  });

  /* 技能条动画 */
  const barIO = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) {
        const i = en.target;
        i.style.width = i.dataset.w + "%";
        barIO.unobserve(i);
      }
    });
  }, { threshold: 0.3 });
  document.querySelectorAll(".bar i").forEach(i => {
    if (reduce) i.style.width = i.dataset.w + "%";
    else barIO.observe(i);
  });

  /* 导航高亮 */
  const navLinks = Array.from(document.querySelectorAll("#navLinks a"));
  const secIO = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) {
        navLinks.forEach(a => a.classList.toggle("active", a.getAttribute("href") === "#" + en.target.id));
      }
    });
  }, { rootMargin: "-45% 0px -50% 0px", threshold: 0 });
  NAV_ITEMS.forEach(n => {
    const sec = document.getElementById(n.id);
    if (sec) secIO.observe(sec);
  });

  /* 回到顶部 */
  const toTop = $("#toTop");
  toTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" }));
  window.addEventListener("scroll", () => {
    toTop.classList.toggle("show", window.scrollY > 420);
  }, { passive: true });
})();
</script>
